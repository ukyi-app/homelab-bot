# homelab 공통 빌드를 태그 ref로 부른다. SHA로 고정하지 않는다: 배포 키 OIDC identity가 이 파일의
# 태그 ref(job_workflow_ref claim, app-build.yaml@refs/tags/app-build-v*)에만 묶여 있어 SHA로 부르면
# 배포 키를 받지 못한다. 태그는 homelab 관리자만 만들고 누구도 옮기거나 지우지 못한다(ruleset D1·D2).
# 새 태그는 Renovate PR로 따라간다. 시험은 Dockerfile의 test 단계에서 돈다.
# main push면 GHCR push와 homelab 배포 PR(미등록 앱이면 요약만)까지 간다.
name: build
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    # 템플릿 저장소 자신은 PR 검사만 한다. main push까지 돌면 템플릿 이름의 이미지를 GHCR에 올리고 배포 키를 받는다.
    if: github.event_name == 'pull_request' || github.repository != 'ukyi-app/homelab-app-template'
    uses: ukyi-app/homelab/.github/workflows/app-build.yaml@app-build-v1.0.1
    # app-build 전체의 상한. reusable 워크플로 권한은 caller를 넘을 수 없고, 넘기면 run 전체가 죽는다.
    permissions:
      contents: read
      packages: write      # push job만 받는다
      id-token: write      # deploy-pr job만 받는다(Infisical OIDC, attestation 서명)
      attestations: write  # deploy-pr job만 받는다
